name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: BrowserSlop-extension
          path: release/*.zip
